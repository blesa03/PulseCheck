services:
  db:
    image: postgres:18-alpine
    env_file: .env.production
    volumes:
      - prod_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: pulsecheck-backend:production
    build:
      context: ./backend
      target: production
    env_file: .env.production
    command:
      - sh
      - -c
      - >
        python manage.py migrate --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
        --workers 3 --timeout 60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: pulsecheck-backend:production
    env_file: .env.production
    command: ["celery", "-A", "config", "worker", "-l", "INFO"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: pulsecheck-backend:production
    env_file: .env.production
    command: ["celery", "-A", "config", "beat", "-l", "INFO"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: pulsecheck-frontend:production
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:${PULSECHECK_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prod_postgres:
  prod_redis: